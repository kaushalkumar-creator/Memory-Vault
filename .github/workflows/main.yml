          // =====================================================
          // TYPE NAME
          // =====================================================

          fun displayType(
              type: String
          ): String {

              return when (type) {

                  "PROMPT" ->
                      "PROMPT"

                  "PHOTO" ->
                      "PHOTO"

                  "VIDEO" ->
                      "VIDEO"

                  "EVENT" ->
                      "EVENT"

                  else ->
                      type
              }
          }


          // =====================================================
          // STORAGE
          // =====================================================

          private const val PREFS =
              "memory_vault_storage"

          private const val MEMORIES_KEY =
              "memories"

          private const val SEARCHES_KEY =
              "searches"


          fun saveMemories(
              context: Context,
              memories: List<Memory>
          ) {

              val array =
                  JSONArray()


              memories.forEach {

                  val obj =
                      JSONObject()

                  obj.put(
                      "id",
                      it.id
                  )

                  obj.put(
                      "type",
                      it.type
                  )

                  obj.put(
                      "title",
                      it.title
                  )

                  obj.put(
                      "description",
                      it.description
                  )

                  obj.put(
                      "mediaUri",
                      it.mediaUri
                  )

                  obj.put(
                      "eventDate",
                      it.eventDate
                  )

                  obj.put(
                      "eventTime",
                      it.eventTime
                  )

                  obj.put(
                      "saved",
                      it.saved
                  )

                  obj.put(
                      "createdAt",
                      it.createdAt
                  )

                  array.put(
                      obj
                  )
              }


              context
                  .getSharedPreferences(
                      PREFS,
                      Context.MODE_PRIVATE
                  )
                  .edit()
                  .putString(
                      MEMORIES_KEY,
                      array.toString()
                  )
                  .apply()
          }


          fun loadMemories(
              context: Context
          ): List<Memory> {

              val prefs =
                  context.getSharedPreferences(
                      PREFS,
                      Context.MODE_PRIVATE
                  )


              val raw =
                  prefs.getString(
                      MEMORIES_KEY,
                      null
                  )


              if (
                  raw.isNullOrBlank()
              ) {

                  return emptyList()
              }


              return try {

                  val array =
                      JSONArray(raw)

                  buildList {

                      for (
                          i in
                              0 until
                              array.length()
                      ) {

                          val obj =
                              array.getJSONObject(
                                  i
                              )

                          add(
                              Memory(

                                  id =
                                      obj.optLong(
                                          "id"
                                      ),

                                  type =
                                      obj.optString(
                                          "type"
                                      ),

                                  title =
                                      obj.optString(
                                          "title"
                                      ),

                                  description =
                                      obj.optString(
                                          "description"
                                      ),

                                  mediaUri =
                                      obj.optString(
                                          "mediaUri"
                                      ),

                                  eventDate =
                                      obj.optString(
                                          "eventDate"
                                      ),

                                  eventTime =
                                      obj.optString(
                                          "eventTime"
                                      ),

                                  saved =
                                      obj.optBoolean(
                                          "saved"
                                      ),

                                  createdAt =
                                      obj.optLong(
                                          "createdAt"
                                      )
                              )
                          )
                      }
                  }

              } catch (
                  _: Exception
              ) {

                  emptyList()
              }
          }


          fun saveSearches(
              context: Context,
              searches: List<String>
          ) {

              val array =
                  JSONArray()


              searches.take(8).forEach {
                  array.put(it)
              }


              context
                  .getSharedPreferences(
                      PREFS,
                      Context.MODE_PRIVATE
                  )
                  .edit()
                  .putString(
                      SEARCHES_KEY,
                      array.toString()
                  )
                  .apply()
          }


          fun loadSearches(
              context: Context
          ): List<String> {

              val raw =
                  context
                      .getSharedPreferences(
                          PREFS,
                          Context.MODE_PRIVATE
                      )
                      .getString(
                          SEARCHES_KEY,
                          null
                      )


              if (
                  raw.isNullOrBlank()
              ) {

                  return emptyList()
              }


              return try {

                  val array =
                      JSONArray(raw)

                  buildList {

                      for (
                          i in
                              0 until
                              array.length()
                      ) {

                          add(
                              array.getString(i)
                          )
                      }
                  }

              } catch (
                  _: Exception
              ) {

                  emptyList()
              }
          }


          // =====================================================
          // ANIMATION HELPER
          // =====================================================

          private fun AnimatorSet.doOnEnd(
              action: () -> Unit
          ) {

              addListener(
                  object :
                      AnimatorListenerAdapter() {

                      override fun onAnimationEnd(
                          animation: Animator
                      ) {

                          action()
                      }
                  }
              )
          }

