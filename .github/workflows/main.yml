          // =====================================================
          // SEARCH LAYER
          // =====================================================

          @Composable
          fun SearchLayer(
              memories: List<Memory>,
              recentSearches: List<String>,
              onClose: () -> Unit,
              onOpenMemory: (Memory) -> Unit,
              onSearchUsed: (String) -> Unit
          ) {

              var query by remember {
                  mutableStateOf("")
              }


              val results =
                  memories.filter {

                      it.title.contains(
                          query,
                          ignoreCase = true
                      ) ||

                              it.description.contains(
                                  query,
                                  ignoreCase = true
                              ) ||

                              displayType(
                                  it.type
                              ).contains(
                                  query,
                                  ignoreCase = true
                              )
                  }


              Dialog(

                  onDismissRequest =
                      onClose,

                  properties =
                      DialogProperties(
                          usePlatformDefaultWidth =
                              false
                      )
              ) {

                  Surface(

                      modifier =
                          Modifier.fillMaxSize(),

                      color =
                          AppBackground
                  ) {

                      Column {

                          // Top bar

                          Row(

                              modifier =
                                  Modifier
                                      .fillMaxWidth()
                                      .padding(
                                          horizontal =
                                              12.dp,
                                          vertical =
                                              10.dp
                                      ),

                              verticalAlignment =
                                  Alignment.CenterVertically
                          ) {

                              IconButton(
                                  onClick =
                                      onClose
                              ) {

                                  Icon(
                                      Icons.Outlined.ArrowBack,
                                      contentDescription =
                                          "Back"
                                  )
                              }


                              Text(
                                  "Search",
                                  color =
                                      AppText,
                                  fontSize =
                                      22.sp,
                                  fontWeight =
                                      FontWeight.SemiBold
                              )
                          }


                          Column(

                              modifier =
                                  Modifier
                                      .fillMaxWidth()
                                      .padding(
                                          horizontal =
                                              20.dp
                                      )
                          ) {

                              OutlinedTextField(

                                  value =
                                      query,

                                  onValueChange = {
                                      query =
                                          it
                                  },

                                  modifier =
                                      Modifier.fillMaxWidth(),

                                  singleLine =
                                      true,

                                  shape =
                                      RoundedCornerShape(
                                          18.dp
                                      ),

                                  leadingIcon = {

                                      Icon(
                                          Icons.Outlined.Search,
                                          contentDescription =
                                              "Search"
                                      )
                                  },

                                  trailingIcon = {

                                      if (
                                          query.isNotEmpty()
                                      ) {

                                          IconButton(
                                              onClick = {
                                                  query =
                                                      ""
                                              }
                                          ) {

                                              Icon(
                                                  Icons.Outlined.Close,
                                                  contentDescription =
                                                      "Clear"
                                              )
                                          }
                                      }
                                  },

                                  placeholder = {
                                      Text(
                                          "Search memories..."
                                      )
                                  }
                              )


                              Spacer(
                                  Modifier.height(
                                      22.dp
                                  )
                              )


                              if (
                                  query.isBlank()
                              ) {

                                  Text(
                                      "Recent Searches",
                                      color =
                                          AppText,
                                      fontSize =
                                          19.sp,
                                      fontWeight =
                                          FontWeight.SemiBold
                                  )


                                  Spacer(
                                      Modifier.height(
                                          12.dp
                                      )
                                  )


                                  if (
                                      recentSearches
                                          .isEmpty()
                                  ) {

                                      Text(
                                          "Your recent searches will appear here.",
                                          color =
                                              AppSecondary,
                                          fontSize =
                                              14.sp
                                      )

                                  } else {

                                      recentSearches.forEach {
                                          search ->

                                          Surface(

                                              modifier =
                                                  Modifier
                                                      .fillMaxWidth()
                                                      .clickable {

                                                          query =
                                                              search

                                                          onSearchUsed(
                                                              search
                                                          )
                                                      },

                                              color =
                                                  Color.White,

                                              shape =
                                                  RoundedCornerShape(
                                                      14.dp
                                                  )
                                          ) {

                                              Row(

                                                  modifier =
                                                      Modifier.padding(
                                                          15.dp
                                                      ),

                                                  verticalAlignment =
                                                      Alignment.CenterVertically
                                              ) {

                                                  Icon(
                                                      Icons.Outlined.Search,
                                                      contentDescription =
                                                          null,
                                                      tint =
                                                          AppSecondary,
                                                      modifier =
                                                          Modifier.size(
                                                              19.dp
                                                          )
                                                  )

                                                  Spacer(
                                                      Modifier.size(
                                                          10.dp
                                                      )
                                                  )

                                                  Text(
                                                      search,
                                                      color =
                                                          AppText
                                                  )
                                              }
                                          }

                                          Spacer(
                                              Modifier.height(
                                                  8.dp
                                              )
                                          )
                                      }
                                  }

                              } else {

                                  Text(
                                      "Search Results",
                                      color =
                                          AppText,
                                      fontSize =
                                          19.sp,
                                      fontWeight =
                                          FontWeight.SemiBold
                                  )


                                  Spacer(
                                      Modifier.height(
                                          10.dp
                                      )
                                  )


                                  if (
                                      results.isEmpty()
                                  ) {

                                      EmptyState(
                                          title =
                                              "No memories found",
                                          subtitle =
                                              "Try another search."
                                      )

                                  } else {

                                      results.forEach {
                                          memory ->

                                          MemoryCard(
                                              memory =
                                                  memory,

                                              onClick = {

                                                  onSearchUsed(
                                                      query
                                                  )

                                                  onOpenMemory(
                                                      memory
                                                  )
                                              }
                                          )

                                          Spacer(
                                              Modifier.height(
                                                  12.dp
                                              )
                                          )
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }


          // =====================================================
          // ADD MEMORY DIALOG
          // =====================================================

          @Composable
          fun AddMemoryDialog(
              type: String,
              onDismiss: () -> Unit,
              onAdd: (Memory) -> Unit
          ) {

              val context =
                  LocalContext.current


              var title by remember {
                  mutableStateOf("")
              }


              var description by remember {
                  mutableStateOf("")
              }


              var eventDate by remember {
                  mutableStateOf("")
              }


              var eventTime by remember {
                  mutableStateOf("")
              }


              var mediaUri by remember {
                  mutableStateOf("")
              }


              val picker =
                  rememberLauncherForActivityResult(
                      ActivityResultContracts.OpenDocument()
                  ) { uri: Uri? ->

                      if (
                          uri != null
                      ) {

                          try {

                              context.contentResolver
                                  .takePersistableUriPermission(
                                      uri,
                                      Intent.FLAG_GRANT_READ_URI_PERMISSION
                                  )

                          } catch (
                              _: Exception
                          ) {
                          }

                          mediaUri =
                              uri.toString()
                      }
                  }


              val pickerType =
                  when (type) {

                      "PHOTO" ->
                          "image/*"

                      "VIDEO" ->
                          "video/*"

                      "PROMPT" ->
                          "image/*"

                      else ->
                          "*/*"
                  }


              AlertDialog(

                  onDismissRequest =
                      onDismiss,

                  title = {

                      Text(
                          "Add ${displayType(type)}"
                      )
                  },


                  text = {

                      Column {

                          OutlinedTextField(

                              value =
                                  title,

                              onValueChange = {
                                  title =
                                      it
                              },

                              modifier =
                                  Modifier.fillMaxWidth(),

                              singleLine =
                                  true,

                              label = {
                                  Text(
                                      when (type) {

                                          "PROMPT" ->
                                              "Prompt title"

                                          "PHOTO" ->
                                              "Photo title"

                                          "VIDEO" ->
                                              "Video title"

                                          else ->
                                              "Event title"
                                      }
                                  }
                              }
                          )


                          Spacer(
                              Modifier.height(
                                  10.dp
                              )
                          )


                          OutlinedTextField(

                              value =
                                  description,

                              onValueChange = {
                                  description =
                                      it
                              },

                              modifier =
                                  Modifier.fillMaxWidth(),

                              minLines =
                                  3,

                              label = {

                                  Text(
                                      when (type) {

                                          "PROMPT" ->
                                              "Prompt / Notes"

                                          "PHOTO" ->
                                              "Photo details"

                                          "VIDEO" ->
                                              "Video details"

                                          else ->
                                              "Event notes"
                                      }
                                  }
                              }
                          )


                          // -------------------------------
                          // EVENT
                          // -------------------------------

                          if (
                              type ==
                              "EVENT"
                          ) {

                              Spacer(
                                  Modifier.height(
                                      10.dp
                                  )
                              )


                              OutlinedTextField(

                                  value =
                                      eventDate,

                                  onValueChange = {
                                      eventDate =
                                          it
                                  },

                                  modifier =
                                      Modifier.fillMaxWidth(),

                                  singleLine =
                                      true,

                                  label = {
                                      Text(
                                          "Date"
                                      )
                                  },

                                  leadingIcon = {
                                      Icon(
                                          Icons.Outlined.CalendarMonth,
                                          contentDescription =
                                              null
                                      )
                                  }
                              )


                              Spacer(
                                  Modifier.height(
                                      10.dp
                                  )
                              )


                              OutlinedTextField(

                                  value =
                                      eventTime,

                                  onValueChange = {
                                      eventTime =
                                          it
                                  },

                                  modifier =
                                      Modifier.fillMaxWidth(),

                                  singleLine =
                                      true,

                                  label = {
                                      Text(
                                          "Time"
                                      )
                                  }
                              )
                          }


                          // -------------------------------
                          // MEDIA
                          // -------------------------------

                          if (
                              type ==
                                  "PHOTO" ||
                              type ==
                                  "VIDEO" ||
                              type ==
                                  "PROMPT"
                          ) {

                              Spacer(
                                  Modifier.height(
                                      12.dp
                                  )
                              )


                              Button(

                                  onClick = {

                                      picker.launch(
                                          arrayOf(
                                              pickerType
                                          )
                                      )
                                  },

                                  modifier =
                                      Modifier.fillMaxWidth()
                              ) {

                                  Icon(
                                      when (type) {

                                          "PHOTO" ->
                                              Icons.Outlined.Image

                                          "VIDEO" ->
                                              Icons.Outlined.Movie

                                          else ->
                                              Icons.Outlined.Image
                                      },

                                      contentDescription =
                                          null
                                  )


                                  Spacer(
                                      Modifier.size(
                                          8.dp
                                      )
                                  )


                                  Text(
                                      if (
                                          mediaUri
                                              .isBlank()
                                      ) {

                                          when (type) {

                                              "PHOTO" ->
                                                  "Choose Photo"

                                              "VIDEO" ->
                                                  "Choose Video"

                                              else ->
                                                  "Add Reference Image"
                                          }

                                      } else {

                                          "Media Selected"
                                      }
                                  )
                              }
                          }
                      }
                  },


                  dismissButton = {

                      TextButton(
                          onClick =
                              onDismiss
                      ) {
                          Text("Cancel")
                      }
                  },


                  confirmButton = {

                      Button(

                          enabled =
                              title.isNotBlank() &&
                                  (
                                      type !=
                                          "PHOTO" ||
                                          mediaUri
                                              .isNotBlank()
                                      ) &&
                                  (
                                      type !=
                                          "VIDEO" ||
                                          mediaUri
                                              .isNotBlank()
                                      ),

                          onClick = {

                              val memory =
                                  Memory(

                                      id =
                                          System.currentTimeMillis(),

                                      type =
                                          type,

                                      title =
                                          title.trim(),

                                      description =
                                          description.trim(),

                                      mediaUri =
                                          mediaUri,

                                      eventDate =
                                          eventDate.trim(),

                                      eventTime =
                                          eventTime.trim(),

                                      saved =
                                          false,

                                      createdAt =
                                          System.currentTimeMillis()
                                  )


                              onAdd(
                                  memory
                              )
                          }
                      ) {

                          Text(
                              "Add Memory"
                          )
                      }
                  }
              )
          }


          // =====================================================
          // DETAIL DIALOG
          // =====================================================

          @Composable
          fun MemoryDetailDialog(
              memory: Memory,
              onDismiss: () -> Unit,
              onToggleSaved: () -> Unit
          ) {

              val context =
                  LocalContext.current


              AlertDialog(

                  onDismissRequest =
                      onDismiss,

                  title = {

                      Row(
                          verticalAlignment =
                              Alignment.CenterVertically
                      ) {

                          Text(
                              memory.title,
                              modifier =
                                  Modifier.weight(
                                      1f
                                  ),
                              fontWeight =
                                  FontWeight.SemiBold
                          )


                          IconButton(
                              onClick =
                                  onDismiss
                          ) {

                              Icon(
                                  Icons.Outlined.Close,
                                  contentDescription =
                                      "Close"
                              )
                          }
                      }
                  },


                  text = {

                      Column {

                          Text(
                              displayType(
                                  memory.type
                              ),
                              color =
                                  AppSecondary,
                              fontSize =
                                  11.sp,
                              fontWeight =
                                  FontWeight.Medium,
                              letterSpacing =
                                  1.sp
                          )


                          Spacer(
                              Modifier.height(
                                  12.dp
                              )
                          )


                          if (
                              memory.description
                                  .isNotBlank()
                          ) {

                              Text(
                                  memory.description,
                                  color =
                                      AppSecondary,
                                  lineHeight =
                                      21.sp
                              )
                          }


                          if (
                              memory.eventDate
                                  .isNotBlank()
                          ) {

                              Spacer(
                                  Modifier.height(
                                      12.dp
                                  )
                              )

                              Text(
                                  "Date: ${memory.eventDate}",
                                  color =
                                      AppText
                              )
                          }


                          if (
                              memory.eventTime
                                  .isNotBlank()
                          ) {

                              Spacer(
                                  Modifier.height(
                                      5.dp
                                  )
                              )

                              Text(
                                  "Time: ${memory.eventTime}",
                                  color =
                                      AppText
                              )
                          }


                          if (
                              memory.mediaUri
                                  .isNotBlank()
                          ) {

                              Spacer(
                                  Modifier.height(
                                      14.dp
                                  )
                              )


                              Button(

                                  onClick = {

                                      try {

                                          val intent =
                                              Intent(
                                                  Intent.ACTION_VIEW
                                              )

                                          intent.setDataAndType(

                                              Uri.parse(
                                                  memory.mediaUri
                                              ),

                                              if (
                                                  memory.type ==
                                                      "VIDEO"
                                              ) {

                                                  "video/*"

                                              } else {

                                                  "image/*"
                                              }
                                          )

                                          intent.addFlags(
                                              Intent.FLAG_GRANT_READ_URI_PERMISSION
                                          )

                                          context.startActivity(
                                              intent
                                          )

                                      } catch (
                                          _: Exception
                                      ) {
                                      }
                                  },

                                  modifier =
                                      Modifier.fillMaxWidth()
                              ) {

                                  Text(
                                      "Open ${if (memory.type == "VIDEO") "Video" else "Photo"}"
                                  )
                              }
                          }
                      }
                  },


                  confirmButton = {

                      TextButton(
                          onClick =
                              onToggleSaved
                      ) {

                          Icon(

                              imageVector =
                                  if (
                                      memory.saved
                                  ) {

                                      Icons.Filled.Favorite

                                  } else {

                                      Icons.Outlined.FavoriteBorder
                                  },

                              contentDescription =
                                  null,

                              modifier =
                                  Modifier.size(
                                      18.dp
                                  )
                          )


                          Spacer(
                              Modifier.size(
                                  6.dp
                              )
                          )


                          Text(
                              if (
                                  memory.saved
                              ) {
                                  "Unsave"
                              } else {
                                  "Save"
                              }
                          )
                      }
                  }
              )
          }


